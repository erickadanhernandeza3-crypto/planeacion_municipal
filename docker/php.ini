; Configuración de PHP para producción (Render).
; La imagen php:8.2-apache no trae ningún php.ini, por lo que PHP usaba sus
; valores por defecto: display_errors=On y output_buffering=Off.

; Nunca mostrar errores al usuario: cualquier warning se imprimía ANTES del
; JSON y rompía las respuestas AJAX ("Invalid JSON response"). Además exponía
; rutas internas del servidor.
display_errors = Off
display_startup_errors = Off

; Los errores se siguen registrando; en Render se ven en la pestaña Logs.
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Igual que en XAMPP local: evita que una salida accidental rompa un header().
output_buffering = 4096

; Zona horaria del municipio, para que las fechas coincidan con las locales.
date.timezone = America/Mexico_City

; No anunciar la versión de PHP en las respuestas (cabecera X-Powered-By)
expose_php = Off

; Cookie de sesión más segura: JavaScript no puede leerla, solo viaja por HTTPS
; y no se envía desde otros sitios.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
