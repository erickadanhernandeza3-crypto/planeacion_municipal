# Configuración extra de Apache para producción (Render).

# Páginas de error con el diseño del sistema en lugar de las genéricas de Apache
ErrorDocument 403 /error.php
ErrorDocument 404 /error.php
ErrorDocument 500 /error.php

# No mostrar el listado de archivos de una carpeta
<Directory /var/www/html>
    Options -Indexes
</Directory>

# Carpetas internas que no deben poder abrirse desde el navegador
<DirectoryMatch "^/var/www/html/(docker|sql)">
    Require all denied
</DirectoryMatch>

# No anunciar la versión de Apache/PHP en las respuestas
ServerTokens Prod
ServerSignature Off

# Cabeceras de seguridad del navegador
<IfModule mod_headers.c>
    # Nadie puede meter el sistema dentro de un iframe de otra página (clickjacking)
    Header always set X-Frame-Options "SAMEORIGIN"
    # El navegador no adivina tipos de archivo (un .txt no se ejecuta como script)
    Header always set X-Content-Type-Options "nosniff"
    # Las direcciones internas no se filtran a otros sitios al seguir un enlace
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Siempre por HTTPS durante un año (Render ya sirve todo por HTTPS)
    Header always set Strict-Transport-Security "max-age=31536000"
</IfModule>
